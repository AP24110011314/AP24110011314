<svg xmlns="http://www.w3.org/2000/svg" width="284" height="28" viewBox="0 0 284 28">
  <style>
    @keyframes radarScale {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    .ripple {
      transform-origin: 16px 14px;
      animation: radarScale 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      fill: none;
      stroke: #22c55e;
      stroke-width: 1.5;
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #166534;
    }
    @media (prefers-color-scheme: dark) {
      .label { fill: #4ade80; }
    }
  </style>
  <rect x="1" y="1" width="282" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1"/>
  <circle class="ripple" cx="16" cy="14" r="4"/>
  <circle cx="16" cy="14" r="4" fill="#22c55e"/>
  <text class="label" x="28" y="18">Open to internships &amp; collaborations</text>
</svg>