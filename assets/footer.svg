<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" width="100%" height="76">
  <defs>
    <clipPath id="footerClip">
      <rect x="1" y="1" width="898" height="74" rx="10" ry="10"/>
    </clipPath>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#131924"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="horizonBeam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#F85D7F"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="footGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#F85D7F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes cometRun {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.35); opacity: 0.45; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes glowBreath {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .comet {
      stroke-dasharray: 260 640;
      animation: cometRun 4.5s linear infinite;
    }
    .glow-area { animation: glowBreath 6s ease-in-out infinite; }
    .eq1 { transform-origin: 48px 38px; animation: eqBar 1.4s ease-in-out infinite; }
    .eq2 { transform-origin: 56px 38px; animation: eqBar 1.4s ease-in-out infinite 0.25s; }
    .eq3 { transform-origin: 64px 38px; animation: eqBar 1.4s ease-in-out infinite 0.5s; }
    .eq4 { transform-origin: 72px 38px; animation: eqBar 1.4s ease-in-out infinite 0.75s; }
    .eq5 { transform-origin: 828px 38px; animation: eqBar 1.4s ease-in-out infinite 0.75s; }
    .eq6 { transform-origin: 836px 38px; animation: eqBar 1.4s ease-in-out infinite 0.5s; }
    .eq7 { transform-origin: 844px 38px; animation: eqBar 1.4s ease-in-out infinite 0.25s; }
    .eq8 { transform-origin: 852px 38px; animation: eqBar 1.4s ease-in-out infinite; }
    .foot-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.6px;
      fill: #E6EDF3;
    }
    .foot-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.4px;
      fill: #8B949E;
    }
  </style>
  <rect x="1" y="1" width="898" height="74" rx="10" ry="10" fill="url(#footBg)"/>
  <g clip-path="url(#footerClip)">
    <rect class="glow-area" x="150" y="0" width="600" height="76" fill="url(#footGlow)"/>
    <line x1="0" y1="74" x2="900" y2="74" stroke="#21262D" stroke-width="2"/>
    <line class="comet" x1="0" y1="74" x2="900" y2="74" stroke="url(#horizonBeam)" stroke-width="2.5" stroke-linecap="round"/>
    <rect class="eq1" x="46" y="28" width="3" height="20" rx="1.5" fill="#F85D7F"/>
    <rect class="eq2" x="54" y="24" width="3" height="28" rx="1.5" fill="#8B5CF6"/>
    <rect class="eq3" x="62" y="29" width="3" height="18" rx="1.5" fill="#38BDF8"/>
    <rect class="eq4" x="70" y="26" width="3" height="24" rx="1.5" fill="#F85D7F"/>
    <rect class="eq5" x="826" y="26" width="3" height="24" rx="1.5" fill="#F85D7F"/>
    <rect class="eq6" x="834" y="29" width="3" height="18" rx="1.5" fill="#38BDF8"/>
    <rect class="eq7" x="842" y="24" width="3" height="28" rx="1.5" fill="#8B5CF6"/>
    <rect class="eq8" x="850" y="28" width="3" height="20" rx="1.5" fill="#F85D7F"/>
  </g>
  <rect x="1" y="1" width="898" height="74" rx="10" ry="10" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <text text-anchor="middle" x="450" y="34" class="foot-title">Driven by Curiosity  •  Crafted with Clean Code</text>
  <text text-anchor="middle" x="450" y="54" class="foot-sub">THANKS FOR VISITING  //  LET'S BUILD SOMETHING IMPACTFUL</text>
</svg>