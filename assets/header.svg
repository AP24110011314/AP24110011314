<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="170">
  <defs>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="898" height="168" rx="12" ry="12"/>
    </clipPath>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111723"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F85D7F" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#F85D7F" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F85D7F"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="traceA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F85D7F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="traceB" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363D" opacity="0.7"/>
    </pattern>
  </defs>
  <style>
    @keyframes orbFloatA {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(45px, 16px) scale(1.08); }
    }
    @keyframes orbFloatB {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-45px, -14px) scale(1.1); }
    }
    @keyframes sweepMove {
      0% { transform: translateX(-400px) skewX(-20deg); }
      100% { transform: translateX(1200px) skewX(-20deg); }
    }
    @keyframes traceFlow {
      0% { stroke-dashoffset: 220; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes traceFlowRev {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 220; }
    }
    @keyframes barPulse {
      0%, 100% { opacity: 0.75; transform: scaleX(0.92); }
      50% { opacity: 1; transform: scaleX(1.04); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes nodePing {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .orb-a { transform-origin: 200px 85px; animation: orbFloatA 9s ease-in-out infinite; }
    .orb-b { transform-origin: 700px 85px; animation: orbFloatB 11s ease-in-out infinite; }
    .sweep { animation: sweepMove 6.5s ease-in-out infinite; }
    .pulse-a { stroke-dasharray: 55 165; animation: traceFlow 3.2s linear infinite; }
    .pulse-b { stroke-dasharray: 55 165; animation: traceFlowRev 3.6s linear infinite; }
    .accent-bar { transform-origin: 450px 107px; animation: barPulse 4s ease-in-out infinite; }
    .cursor { animation: blinkCursor 1.1s steps(1, end) infinite; }
    .node1 { animation: nodePing 2.4s ease-in-out infinite; }
    .node2 { animation: nodePing 3.1s ease-in-out infinite 0.8s; }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.4px;
      fill: #8B949E;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.6px;
      fill: #F0F6FC;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #9EA7B3;
    }
  </style>
  <rect x="1" y="1" width="898" height="168" rx="12" ry="12" fill="url(#bgBase)"/>
  <g clip-path="url(#bannerClip)">
    <rect x="0" y="0" width="900" height="170" fill="url(#dotGrid)"/>
    <ellipse class="orb-a" cx="200" cy="85" rx="260" ry="130" fill="url(#glowRose)"/>
    <ellipse class="orb-b" cx="700" cy="85" rx="260" ry="130" fill="url(#glowCyan)"/>
    <rect class="sweep" x="0" y="0" width="260" height="170" fill="url(#sweepGrad)"/>
    <path d="M0,42 L95,42 L120,67 L185,67" fill="none" stroke="#21262D" stroke-width="1.5"/>
    <path class="pulse-a" d="M0,42 L95,42 L120,67 L185,67" fill="none" stroke="url(#traceA)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M0,128 L75,128 L100,103 L165,103" fill="none" stroke="#21262D" stroke-width="1.5"/>
    <path class="pulse-a" d="M0,128 L75,128 L100,103 L165,103" fill="none" stroke="url(#traceA)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M900,42 L805,42 L780,67 L715,67" fill="none" stroke="#21262D" stroke-width="1.5"/>
    <path class="pulse-b" d="M900,42 L805,42 L780,67 L715,67" fill="none" stroke="url(#traceB)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M900,128 L825,128 L800,103 L735,103" fill="none" stroke="#21262D" stroke-width="1.5"/>
    <path class="pulse-b" d="M900,128 L825,128 L800,103 L735,103" fill="none" stroke="url(#traceB)" stroke-width="1.8" stroke-linecap="round"/>
    <circle class="node1" cx="185" cy="67" r="3" fill="#F85D7F"/>
    <circle class="node2" cx="165" cy="103" r="3" fill="#8B5CF6"/>
    <circle class="node1" cx="715" cy="67" r="3" fill="#38BDF8"/>
    <circle class="node2" cx="735" cy="103" r="3" fill="#8B5CF6"/>
    <rect x="0" y="0" width="900" height="2" fill="url(#accentLine)" opacity="0.85"/>
  </g>
  <rect x="1" y="1" width="898" height="168" rx="12" ry="12" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <text text-anchor="middle" x="450" y="44" class="eyebrow">// AI &amp; ML  ·  FULL-STACK SYSTEMS  ·  DSA<tspan class="cursor" fill="#F85D7F"> _</tspan></text>
  <text text-anchor="middle" x="450" y="88" class="title">Aman Maddheshiya</text>
  <rect class="accent-bar" x="330" y="105" width="240" height="3" rx="1.5" fill="url(#accentLine)"/>
  <text text-anchor="middle" x="450" y="133" class="subtitle">B.Tech AI &amp; ML @ SRM University AP  •  Research Intern  •  Open-Source Builder</text>
</svg>