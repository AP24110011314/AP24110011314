<svg xmlns="http://www.w3.org/2000/svg" width="320" height="28" viewBox="0 0 320 28">
  <style>
    @keyframes dotPulseA {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    @keyframes dotPulseB {
      0%, 100% { opacity: 1; transform: scale(1.25); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .d1 { transform-origin: 15px 14px; animation: dotPulseA 2.2s ease-in-out infinite; }
    .d2 { transform-origin: 148px 14px; animation: dotPulseB 2.2s ease-in-out infinite; }
    .lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #1F2328;
    }
    @media (prefers-color-scheme: dark) {
      .lbl { fill: #E6EDF3; }
    }
  </style>
  <rect x="1" y="1" width="318" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.38" stroke-width="1"/>
  <circle class="d1" cx="15" cy="14" r="3.5" fill="#FFA116"/>
  <text class="lbl" x="26" y="18">211 LeetCode</text>
  <text class="lbl" x="126" y="18" fill="#8B949E">•</text>
  <circle class="d2" cx="148" cy="14" r="3.5" fill="#F85D7F"/>
  <text class="lbl" x="159" y="18">206 CodeChef (Bronze)</text>
</svg>