<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 14" width="100%" height="14">
  <defs>
    <linearGradient id="divPulse" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#F85D7F"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glide {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes diamondPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .beam {
      stroke-dasharray: 180 720;
      animation: glide 4.2s linear infinite;
    }
    .diamond {
      transform-origin: 450px 7px;
      animation: diamondPulse 2.8s ease-in-out infinite;
    }
  </style>
  <line x1="0" y1="7" x2="900" y2="7" stroke="#21262D" stroke-width="1.2"/>
  <line class="beam" x1="0" y1="7" x2="900" y2="7" stroke="url(#divPulse)" stroke-width="1.8" stroke-linecap="round"/>
  <polygon class="diamond" points="450,2 455,7 450,12 445,7" fill="#0D1117" stroke="url(#divPulse)" stroke-width="1.4"/>
</svg>